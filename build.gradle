plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
base { archivesName = "handykit" }

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://repo.viaversion.com/everything/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Optional at runtime and never bundled: Mod Menu only loads ModMenuEntry when it is there, and only
    // mcport.transfer.Via and ViaBridge (and the two @Pseudo Via mixins) touch ViaFabricPlus, when it is loaded.
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    compileOnly("com.viaversion:viafabricplus:${viafabricplus_version}") { transitive = false }
    compileOnly("com.viaversion:viafabricplus-api:${viafabricplus_version}") { transitive = false }
    compileOnly("com.viaversion:viaversion-common:${viaversion_version}") { transitive = false }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

jar {
    from("LICENSE") { rename { "LICENSE_handykit" } }
    from("NOTICE.md") { rename { "NOTICE_handykit.md" } }
}
